[project]
name = "backend"
version = "0.1.0"
description = "FastAPI로 만든 스터디용 할 일 API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit==4.5.1",
    "pytest>=9.2.0",
]
