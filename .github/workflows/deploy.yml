name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 같은 서버에 두 배포가 동시에 파일을 복사하지 않게 한다.
concurrency:
  group: study-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.4"
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: |
          uv sync --locked --project backend
          npm --prefix frontend ci

      - name: Run checks
        run: uv run --locked --project backend pre-commit run --all-files

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Check deployment files
        env:
          DOCKERHUB_USERNAME: study-example
          IMAGE_TAG: ${{ github.sha }}
        run: |
          bash -n deploy/deploy.sh
          bash -n deploy/remote.sh
          docker compose -f deploy/compose.yaml config --quiet

  publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        run: |
          docker build --platform linux/amd64 \
            -t "docker.io/$DOCKERHUB_USERNAME/study-backend:$IMAGE_TAG" ./backend
          docker push "docker.io/$DOCKERHUB_USERNAME/study-backend:$IMAGE_TAG"

      - name: Build and push frontend
        run: |
          docker build --platform linux/amd64 \
            -t "docker.io/$DOCKERHUB_USERNAME/study-frontend:$IMAGE_TAG" ./frontend
          docker push "docker.io/$DOCKERHUB_USERNAME/study-frontend:$IMAGE_TAG"

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Deploy to EC2
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: bash deploy/remote.sh
