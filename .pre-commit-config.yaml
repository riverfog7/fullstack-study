repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: local
    hooks:
      - id: backend-tests
        name: backend tests
        entry: uv run --project backend pytest backend/tests
        language: system
        pass_filenames: false
        files: ^(backend/|\.pre-commit-config\.yaml$)

      - id: frontend-lint
        name: frontend lint
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        files: ^(frontend/|\.pre-commit-config\.yaml$)

      - id: frontend-types
        name: frontend types
        entry: npm --prefix frontend run typecheck
        language: system
        pass_filenames: false
        files: ^(frontend/|\.pre-commit-config\.yaml$)

      - id: frontend-tests
        name: frontend tests
        entry: npm --prefix frontend test
        language: system
        pass_filenames: false
        files: ^(frontend/|\.pre-commit-config\.yaml$)
